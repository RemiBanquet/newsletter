name: Daily Agri-News Digest v5

on:
  schedule:
    # 07:30 UTC every day (08:30 Paris CET / 09:30 Paris CEST)
    - cron: "17 5 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  run-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Chrome (pinned for Selenium scrapers)
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
        id: setup-chrome

      - name: Install dependencies
        run: pip install -r newsletter_v5/requirements.txt

      - name: Run newsletter pipeline
        env:
          # Selenium scrapers: only set CHROME_PATH; webdriver-manager
          # downloads a matched chromedriver at runtime to avoid version mismatches
          # between setup-chrome's installed Chrome and ChromeDriver.
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          # Notion + LLM + delivery secrets
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_SOURCES_DB_ID: ${{ secrets.NOTION_SOURCES_DB_ID }}
          NOTION_RECIPIENTS_DB_ID: ${{ secrets.NOTION_RECIPIENTS_DB_ID }}
          NOTION_COMPANIES_DB_ID: ${{ secrets.NOTION_COMPANIES_DB_ID }}
          NOTION_COUNTRIES_DB_ID: ${{ secrets.NOTION_COUNTRIES_DB_ID }}
          NOTION_ARTICLES_DB_ID: ${{ secrets.NOTION_ARTICLES_DB_ID }}
          NOTION_PUBLICATIONS_DB_ID: ${{ secrets.NOTION_PUBLICATIONS_DB_ID }}
          NOTION_SIGNALS_DB_ID: ${{ secrets.NOTION_SIGNALS_DB_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          cd newsletter_v5
          python newsletter_v5.py

      - name: Persist state (dedup + geocache + config cache)
        if: always()
        run: |
          cd newsletter_v5
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f sent_articles.json sent_publications.json sent_signals.json \
                    geocache.db config_cache.yaml pam_last_year.json \
                    source_health.json .psd_cache 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update pipeline state [skip ci]"
          git push
