name: Daily Agri-News Digest v5

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

jobs:
  run-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r newsletter_v5/requirements.txt

      - name: Run newsletter pipeline
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_SOURCES_DB_ID: ${{ secrets.NOTION_SOURCES_DB_ID }}
          NOTION_RECIPIENTS_DB_ID: ${{ secrets.NOTION_RECIPIENTS_DB_ID }}
          NOTION_COMPANIES_DB_ID: ${{ secrets.NOTION_COMPANIES_DB_ID }}
          NOTION_COUNTRIES_DB_ID: ${{ secrets.NOTION_COUNTRIES_DB_ID }}
          NOTION_ARTICLES_DB_ID: ${{ secrets.NOTION_ARTICLES_DB_ID }}
          NOTION_PUBLICATIONS_DB_ID: ${{ secrets.NOTION_PUBLICATIONS_DB_ID }}
          NOTION_SIGNALS_DB_ID: ${{ secrets.NOTION_SIGNALS_DB_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEMLIST_API_KEY: ${{ secrets.LEMLIST_API_KEY }}
          LEMLIST_ADMIN_LEAD_ID: ${{ secrets.LEMLIST_ADMIN_LEAD_ID }}
        run: |
          cd newsletter_v5
          python newsletter_v5.py

      - name: Persist state (dedup + geocache + config cache)
        if: always()
        run: |
          cd newsletter_v5
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f sent_articles.json sent_publications.json sent_signals.json \
                    geocache.db config_cache.yaml pam_last_year.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update pipeline state [skip ci]"
          git push
