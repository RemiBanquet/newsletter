name: Daily Agri-News Digest Generation

permissions:
  contents: write

on:
  schedule:
    - cron: '30 6 * * *'  # Tous les jours à 08:30 (UTC+2)
  workflow_dispatch: {}

jobs:
  generate-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Check if sent_articles.json exists
        id: check_sent_articles
        run: |
          if [ -f "sent_articles.json" ]; then
            echo "Le fichier sent_articles.json existe déjà"
          else
            echo "[]" > sent_articles.json
          fi

      - name: Check if sent_publications.json exists
        id: check_sent_publications
        run: |
          if [ -f "sent_publications.json" ]; then
            echo "Le fichier sent_publications.json existe déjà"
          else
            echo "[]" > sent_publications.json
          fi

      - name: Run newsletter script
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL_NAME: ${{ secrets.MISTRAL_MODEL_NAME }}
          MISTRAL_FALLBACK_MODEL_NAME: ${{ secrets.MISTRAL_FALLBACK_MODEL_NAME }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_OFFICIAL_DATABASE_ID: ${{ secrets.NOTION_OFFICIAL_DATABASE_ID }}
          GMAIL_SMTP_SERVER: ${{ secrets.GMAIL_SMTP_SERVER }}
          GMAIL_SMTP_PORT: ${{ secrets.GMAIL_SMTP_PORT }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          FEED_URLS: ${{ secrets.FEED_URLS }}
        run: python newsletterv4-3.py

      - name: Commit updated sent_articles.json
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add sent_articles.json
          git commit -m "Update sent_articles.json after newsletter generation" || echo "No changes to commit"
          git push

      - name: Commit updated sent_publications.json
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add sent_publications.json
          git commit -m "🧠 Update sent_publications.json" || echo "No changes to commit"
          git push
