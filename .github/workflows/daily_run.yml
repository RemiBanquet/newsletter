name: Daily Newsletter Generation

on:
  schedule:
    # Exécution à 07:00 UTC (09:00 UTC+2)
    - cron: '0 7 * * *'
  workflow_dispatch:  # Permet l'exécution manuelle depuis l'interface GitHub

jobs:
  generate-newsletter:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Set up Chrome
      uses: browser-actions/setup-chrome@v1
      
    - name: Run newsletter script
      env:
        FEED_URLS: ${{ secrets.FEED_URLS }}
        EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        # Ajoutez ici d'autres variables d'environnement nécessaires
      run: python newsletter_with_agreste.py
