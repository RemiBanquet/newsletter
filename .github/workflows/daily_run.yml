name: Daily Agri-News Digest Generation

# Ajoutez cette section pour définir les permissions
permissions:
  contents: write

on:
  schedule:
    # Exécution à 06:30 UTC (08:30 UTC+2)
    - cron: '30 6 * * *'
  workflow_dispatch:  # Permet l'exécution manuelle depuis l'interface GitHub

jobs:
  generate-newsletter:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Set up Chrome
      uses: browser-actions/setup-chrome@v1
      
    # Au lieu d'utiliser download-artifact, nous allons vérifier si le fichier existe déjà dans le dépôt
    - name: Check if sent_articles.json exists
      id: check_file
      run: |
        if [ -f "sent_articles.json" ]; then
          echo "Le fichier sent_articles.json existe déjà dans le dépôt"
        else
          echo "Le fichier sent_articles.json n'existe pas, création d'un fichier vide"
          echo "[]" > sent_articles.json
        fi
      
    - name: Run newsletter script
      env:
        MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        GMAIL_SMTP_SERVER: ${{ secrets.GMAIL_SMTP_SERVER }}
        GMAIL_SMTP_PORT: ${{ secrets.GMAIL_SMTP_PORT }}
        GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
        GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        FEED_URLS: ${{ secrets.FEED_URLS }}
        EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        
      run: python newsletter_with_agreste.py
      
    # Après l'exécution, nous allons committer les changements au fichier sent_articles.json
    - name: Commit updated sent_articles.json
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add sent_articles.json
        git commit -m "Update sent_articles.json after newsletter generation" || echo "No changes to commit"
        git push
